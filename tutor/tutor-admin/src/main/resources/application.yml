# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径（本机为 Linux，已从 Windows 的 D:/ruoyi/uploadPath 改为项目内目录）
  profile: /home/ubuntu/PlatformE/tutor-platform/data/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口
  # 原为 8080，但本机 127.0.0.1:8080 已被平台的 Caddy（DSH 面板）占用，无法绑定；
  # 现改为 12501，并对外网开放（前端 12500 通过代理转发到这里）。
  port: 12501
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.tutor: debug
    org.springframework: warn

# 管理员配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: false
  # redis 配置
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password: ${REDIS_PASSWORD}
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  # 强随机值（64 hex）。改这里之后所有旧 token 立即失效，用户需要重新登录一次。
  secret: ${JWT_SECRET}
  # 令牌有效期（默认30分钟）
  expireTime: 1440

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.tutor.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger —— 生产环境必须关闭（接口文档会暴露全部 API 与参数）
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice,/system/tutorInfo
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
# 客户注册的邮箱验证码
customer:
  # 按 IP 限流（防「换着邮箱刷验证码」和暴力破解登录）
  ratelimit:
    enabled: ${CUSTOMER_RATELIMIT_ENABLED:true}
    # 同一 IP 每分钟 / 每小时最多请求几次验证码
    send-code-per-minute: ${CUSTOMER_RL_SEND_CODE_MIN:15}
    send-code-per-hour: ${CUSTOMER_RL_SEND_CODE_HOUR:100}
    # 同一 IP 每小时最多注册几次
    register-per-hour: ${CUSTOMER_RL_REGISTER_HOUR:50}
    # 同一 IP + 邮箱 10 分钟内最多登录尝试几次
    login-per-10min: ${CUSTOMER_RL_LOGIN_10MIN:20}
  mail:
    # 开发模式（默认开）：没有 SMTP 时验证码写后台日志并随响应回显，方便本地联调。
    # 线上通过 data/mail.env 里的 MAIL_DEV_MODE=false 关掉；
    # 另外即使误开，只要真的配了 SMTP，也不会回显验证码（见 CustomerVerificationService）。
    dev-mode: ${MAIL_DEV_MODE:true}
    # 自动化测试开关：命中下面这些「收不到信」的测试域名时，跳过发信、直接把验证码回显。
    # 只对白名单域名生效，真实邮箱永远走 SMTP；默认关闭，测试时临时用 MAIL_TEST_ECHO=true。
    test-echo: ${MAIL_TEST_ECHO:false}
    test-echo-domains: ${MAIL_TEST_ECHO_DOMAINS:example.com,demo.com,test.local}
    # 验证码有效期（秒）
    code-expire-seconds: 300
    # 同一邮箱两次发送的最小间隔（秒）
    resend-interval-seconds: 60
    # 同一邮箱每小时最多发几次
    hourly-limit: 10
    # 同一验证码最多允许错几次（超过即作废）
    max-verify-attempts: 5
    # 发件人显示名；留空则用 spring.mail.username
    from: ""

# 真实发信配置（本机实测出站 465 端口可达，填上就能真发邮件）
# 以 QQ 邮箱为例：password 填「授权码」而不是登录密码。
