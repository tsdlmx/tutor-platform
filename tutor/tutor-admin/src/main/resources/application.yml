#      mail.smtp.timeout: 10000
#      mail.smtp.connectiontimeout: 10000

# 业务配置
business:
  # 押金配置
  deposit:
    # 家长入驻平台最低押金（元）
    parent-settle-min: 0.01
    # 家教入驻平台最低押金（元）
    tutor-settle-min: 0.01
    # 家长发布需求单最低押金（元/科目）
    demand-publish-min: 0.01
    # 家教接单最低押金（元）
    demand-accept-min: 0.01
    # 预约试课最低押金（元）
    trial-min: 0.01

