# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            # 本机 MySQL 8.0.46 的 TLS 与 JDK 8 的默认 cipher 协商不上（handshake_failure），
            # 所以显式限定 TLSv1.2；若仍失败可改 useSSL=false 并加 allowPublicKeyRetrieval=true
            # （仅本机回环连接才可这样做）。
            master:
                url: jdbc:mysql://localhost:3307/tutor?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&enabledTLSProtocols=TLSv1.2&serverTimezone=GMT%2B8
                username: ${DB_USERNAME}
                password: ${DB_PASSWORD}
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter:
                # 关闭 Web 统计过滤器（生产不需要，且会记录全部请求 URL）
                enabled: false
            statViewServlet:
                # 关闭 Druid 监控台（/druid/* 可看全部 SQL、连接池、会话，不该对外）
                enabled: false
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true