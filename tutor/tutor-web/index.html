<!doctype html>
<html lang="zh-CN" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <!-- 给个图标：否则浏览器会去要 /favicon.ico，dev server 返回 404 并在控制台报错 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="家教中介平台 —— 学生发布需求，老师接单，管理后台在 /admin" />
    <!-- 手机号样式/自动识别一律关掉，避免 iOS 把邮箱、数字渲染成蓝色链接 -->
    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="家教中介平台" />
    <title>家教中介平台</title>
    <style>
      /*
        首屏占位：JS 还没跑起来时先给一个和真实界面同色系的骨架，
        比空白 + 居中一行灰字"更像已经加载好了"，视觉上不会跳。
        main.tsx 一挂载就会把这个节点删掉。
      */
      html,
      body {
        margin: 0;
        background: #f6f6f8;
      }
      html.dark,
      html.dark body {
        background: #0b0b0f;
      }
      #app-boot {
        display: flex;
        height: 100vh;
        height: 100dvh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font: 14px/1.5 -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: #71717a;
      }
      #app-boot .boot-dot {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        border: 2px solid rgba(113, 113, 122, 0.25);
        border-top-color: #71717a;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-boot .boot-dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-boot">
        <span class="boot-dot"></span>
        <span>正在加载 家教中介平台 …</span>
      </div>
    </div>
    <noscript>这个页面需要开启 JavaScript 才能使用。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
