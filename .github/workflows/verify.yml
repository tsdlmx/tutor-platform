# 上线前验收流水线（GitHub Actions 示例）
#
# 如果不用 GitHub，把两个 job 的 step 原样搬到自己的 CI（GitLab CI / Jenkins /
# 云效都支持同样的 shell 步骤）。脚本本体是 scripts/verify.sh，本地也能直接跑。
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: 构建、静态检查、依赖漏洞
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod 里 toolchain 固定为 go1.26.9（更早的标准库有已修复漏洞）
          go-version: '1.26.9'

      - uses: pnpm/action-setup@v4
        with:
          # 锁文件由 pnpm 12 写入，pnpm 9 已无法读取（缺 packages 字段）；
          # pnpm 10 实测可 --frozen-lockfile 安装，这里取 10
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: tutor/tutor-web/pnpm-lock.yaml

      - name: 安装 govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: 运行验收脚本
        working-directory: tutor/tutor-web
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
          cd ../..
          bash scripts/verify.sh

      - name: 上传构建产物（排障用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: tutor/tutor-web/dist
          retention-days: 7

  migrate:
    name: 迁移在真实 PostgreSQL 上可应用
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tutor
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'

      - name: 应用全部版本化迁移
        working-directory: tutor/tutor-api
        env:
          DATABASE_DSN: postgres://postgres:postgres@127.0.0.1:5432/tutor?sslmode=disable
        run: go run ./cmd/migrate

      - name: 重复执行应为幂等
        working-directory: tutor/tutor-api
        env:
          DATABASE_DSN: postgres://postgres:postgres@127.0.0.1:5432/tutor?sslmode=disable
        run: go run ./cmd/migrate

      - name: 校验迁移账本与关键表存在
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d tutor -v ON_ERROR_STOP=1 -c \
            "SELECT count(*) AS applied FROM schema_migrations;" -c \
            "SELECT table_name FROM information_schema.tables
               WHERE table_schema='public'
                 AND table_name IN ('sys_user','sys_user_auth','sys_login_audit','sys_oper_log',
                                    't_customer_account','t_customer_consent','t_tutor_info')
               ORDER BY table_name;"
