# 家教 Web API —— journald 保留策略
#
# 安装：sudo install -m 0644 deploy/systemd/journald-tutor.conf /etc/systemd/journald.conf.d/tutor.conf
#       sudo systemctl restart systemd-journald
#
# 服务日志走 journald（见 deploy/systemd/tutor-api.service 的 StandardOutput=journal）。
# 等保要求日志留存不少于六个月，这里按"最多 26 周 + 总量上限"约束，
# 避免磁盘被日志吃满的同时保证窗口够用。

[Journal]
# 单机日志总量的硬上限；按实际磁盘容量调整（这里按 2 GB 给）
SystemMaxUse=2G
# 单文件上限，便于轮转
SystemMaxFileSize=64M
# 保留窗口：26 周 ≈ 6 个月
MaxRetentionSec=26week
# 压缩旧的归档日志，节省空间
Compress=yes
