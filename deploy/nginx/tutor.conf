# ============================================================================
# 家教中介平台 —— nginx 站点配置（示例）
# ----------------------------------------------------------------------------
# 用法：放到 /etc/nginx/conf.d/tutor.conf（conf.d 在 http 上下文被 include，
# 所以下面的 limit_req_zone 与 server 都能放这一份文件里）。
#
# 替换项：
#   tutor.example.com        你的域名
#   /etc/letsencrypt/...     证书路径（或用自签证书做内网验证）
#   /srv/tutor-web           前端 dist 的发布目录
#
# 后端分配：
#   /web-api/   -> Go Web API（客户 Web）
#   /admin-api/ -> Go Web API（管理员认证 + 已迁移管理接口）
#   /dev-api/   -> 仅当 Java 仍作为回滚路径保留时才需要；Go 单后端可整段删除
# ============================================================================

upstream tutor_api {
    server 127.0.0.1:12502;      # Go 服务；Java 退役后可直接改成 12501
    keepalive 32;
}

# 登录、验证码这类接口单独限流：每 IP 每分钟 20 次，突发 10 次
limit_req_zone $binary_remote_addr zone=tutor_login:10m rate=20r/m;
# 其余 API 的兜底限流：每 IP 每秒 20 次
limit_req_zone $binary_remote_addr zone=tutor_api:10m rate=20r/s;

# 把 HTTP 全量跳到 HTTPS（HSTS 只允许在 HTTPS 响应上学习）
server {
    listen 80;
    listen [::]:80;
    server_name tutor.example.com;

    # 证书续期用
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tutor.example.com;

    # ---- TLS --------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/tutor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tutor.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- 安全响应头 -------------------------------------------------------
    # 公共头放在 snippets/tutor-headers.conf；任何自带 add_header 的 location
    # 都必须再 include 一次，否则会丢掉这一整组头（nginx 的继承规则）。
    include /etc/nginx/snippets/tutor-headers.conf;
    # ---- 通用限制 ---------------------------------------------------------
    client_max_body_size 8m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;

    # 访问日志：等保要求可追溯，交给 logrotate/journal 归档
    access_log /var/log/nginx/tutor.access.log;
    error_log  /var/log/nginx/tutor.error.log warn;

    # 点文件一律不对外（.env、.git 之类）
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # ---- 前端静态资源 -----------------------------------------------------
    root /srv/tutor-web;
    index index.html;

    # 带哈希的构建产物可以长缓存
    location /assets/ {
        access_log off;
        include /etc/nginx/snippets/tutor-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA 外壳不缓存：否则发版后浏览器仍跑旧 index.html 引用已删除的 chunk
    location = /index.html {
        include /etc/nginx/snippets/tutor-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # 其余路径交给前端路由（/admin/**、/tutors/**、/me 等）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Go Web API：客户侧 ----------------------------------------------
    location /web-api/ {
        limit_req zone=tutor_api burst=40 nodelay;
        proxy_pass http://tutor_api/;
        include /etc/nginx/snippets/tutor-proxy.conf;
    }

    # ---- Go Web API：管理端 ----------------------------------------------
    # 登录与验证码单独限流，挡住撞库与验证码刷取
    location ~ ^/admin-api/(login|captchaImage)$ {
        limit_req zone=tutor_login burst=10 nodelay;
        proxy_pass http://tutor_api;
        include /etc/nginx/snippets/tutor-proxy.conf;
    }

    location /admin-api/ {
        limit_req zone=tutor_api burst=40 nodelay;
        proxy_pass http://tutor_api/;
        include /etc/nginx/snippets/tutor-proxy.conf;
    }

    # ---- 过渡期：Java 仍作为回滚路径时保留（Go 单后端可删除）-------------
    # location /dev-api/ {
    #     proxy_pass http://127.0.0.1:12501/;
    #     include /etc/nginx/snippets/tutor-proxy.conf;
    # }
}
