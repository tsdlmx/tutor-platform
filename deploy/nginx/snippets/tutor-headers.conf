# 站点公共安全响应头。
#
# 为什么单独成文件：nginx 的 add_header 只在「当前层级没有任何 add_header」时才继承
# 父级设置。所以只要某个 location 自己写了 add_header（例如 /index.html 的
# Cache-Control），就必须把这一组头再 include 一次，否则页面响应会丢掉 HSTS/CSP。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=()" always;

# 前端是 SPA：需要自身脚本与样式。构建产物 index.html 内含一段内联 <style> 骨架屏，
# React 也用内联 style 属性，因此 style-src 必须允许 inline；没有内联 <script>，
# script-src 保持 'self'。
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
